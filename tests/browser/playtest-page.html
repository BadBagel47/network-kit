<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playtest test page</title>
</head>
<body>
  <h1>A game</h1>
  <canvas id="game" width="640" height="360" tabindex="0"></canvas>
  <p id="keys">0</p>
  <script type="module">
    import { startPlaytest, startRecorder } from '/src/client/playtest-entry.js';
    // The game draws something to take a picture of, and counts the keys it gets.
    const c = document.getElementById('game');
    const g = c.getContext('2d');
    g.fillStyle = '#204080';
    g.fillRect(0, 0, 640, 360);
    g.fillStyle = '#ffcc33';
    g.fillRect(100, 100, 200, 120);
    let keys = 0;
    window.addEventListener('keydown', () => { keys += 1; document.getElementById('keys').textContent = String(keys); });
    c.focus();
    const admin = new URLSearchParams(location.search).get('admin');
    window.playtest = await startPlaytest({
      admin,
      version: 'test-1',
      items: [
        { id: 'T-1', title: 'The base inside', where: 'dator', steps: ['Go in', 'Look at the light'], links: [['Start here', './playtest-page.html?admin=' + encodeURIComponent(admin) + '&at=base']], ask: ['Is the light right?', 'How many frames per second?'] },
        { id: 'T-2', title: 'Music on start', steps: ['Open the game'], links: [], ask: 'Does the music start?' },
        // F-121: a scripted test: keys to the game, a check, a measurement with the game's own measure, a question.
        { id: 'T-3', title: 'Scripted', steps: ['The script plays'], links: [], run: async (t) => {
          t.step('Press a key');
          await t.key('w', { hold: 20 });
          t.check(Number(document.getElementById('keys').textContent) > 0, 'the game got the key');
          setTimeout(() => { performance.mark('work-start'); performance.measure('work', 'work-start'); }, 100);
          const m = await t.measure('play', 400);
          t.check(m.frames > 0, 'frames were drawn');
          t.step('Ask');
          await t.ask('Does it look right?');
        } },
      ],
      context: () => ({ mode: 'test', at: new URLSearchParams(location.search).get('at') }),
    });
    // Playtest Recorder too, when the test asks (Open test, F-118).
    if (new URLSearchParams(location.search).has('rec')) window.recorder = await startRecorder({ admin, version: 'test-1' });
    window.ready = true;
  </script>
</body>
</html>
