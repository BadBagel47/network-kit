# Deploys the demo Worker (examples/demo) to Cloudflare from main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers edit rights);
# CLOUDFLARE_ACCOUNT_ID is optional. Without the token the job is skipped.
name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - src/**
      - examples/**
      - wrangler.jsonc
      - package.json
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRYTHIS_COUNTRY_BYPASS: ${{ secrets.TRYTHIS_COUNTRY_BYPASS }} # lets the check past the country rule on trythis.one (Q6)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the demo deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Test, deploy and check
        if: steps.token.outputs.skip != 'true'
        run: |
          npm ci
          npm test
          # Also at nk-demo.trythis.one (F-098); workers.dev stays for now.
          npm run demo:assets
          # A brand-new Worker can fail with "This Worker does not exist on your account.
          # [code: 10007]" right after its upload; trying once more works (F-112, from Bricks).
          deploy() {
            for attempt in 1 2; do
              npx wrangler deploy "$@" 2>&1 | tee deploy.log
              [ "${PIPESTATUS[0]}" = 0 ] && return 0 # the step's shell has no pipefail
              grep -q 'code: 10007' deploy.log || return 1
              echo "::notice::Cloudflare did not know the new Worker yet (10007); trying once more"
              sleep 15
            done
            return 1
          }
          if ! deploy --domain nk-demo.trythis.one; then
            echo "::warning::Could not attach nk-demo.trythis.one (the deploy token may lack the zone's Workers Routes and DNS permissions); deployed on workers.dev only"
            deploy
          fi
          # The key for reading the measurement reports (F-047), derived from the
          # token so the reading workflow can make the same key.
          DIAG_KEY=$(printf 'network-kit demo diag\n%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$DIAG_KEY"
          printf '%s' "$DIAG_KEY" | npx wrangler secret put DIAG_KEY
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            # No workers.dev address (it may be retired): check the trythis.one address past the
            # country rule instead of passing without a check (F-137).
            url=https://nk-demo.trythis.one
            if [ -n "$TRYTHIS_COUNTRY_BYPASS" ]; then echo "::add-mask::$TRYTHIS_COUNTRY_BYPASS"; printf 'header = "x-trythis-country-bypass: %s"\n' "$TRYTHIS_COUNTRY_BYPASS" > "$HOME/.curlrc"; fi
            echo "::notice::no workers.dev address in the deploy output; checking $url"
          fi
          echo "Demo: $url" >> "$GITHUB_STEP_SUMMARY"
          # Right after a deploy the previous version may still answer for a while
          # (B-119, seen by Bricks): wait until /rooms gives the version just deployed.
          want=$(node -p "require('./package.json').version")
          for i in $(seq 1 36); do
            body=$(curl -fsS "$url/rooms" || true)
            echo "$body" | grep -q "\"version\":\"$want\"" && break
            sleep 5
          done
          echo "$body" | grep -q "\"version\":\"$want\"" || { echo "::error::$url/rooms did not answer with version $want within 3 minutes (last: $body)"; exit 1; }
          # A room can be created (checks the Durable Objects and the EU setting).
          # A demo closed on the admin page answers 503 with its reason; that is
          # not a failed deploy (B-082).
          status=$(curl -sS -o create.json -w '%{http_code}' -X POST "$url/rooms" -H 'content-type: application/json' -d '{}' || echo 000)
          if [ "$status" = 200 ] && grep -q '"code"' create.json; then
            echo "Room creation works on $url" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = 503 ] && grep -Eq '"error":"(off|budget|stopped|timer|game-closed)"' create.json; then
            echo "::notice::The demo takes no new players right now ($(cat create.json)); room creation was not checked"
            echo "The demo is closed on the admin page; room creation was not checked" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::creating a room on $url failed ($status: $(cat create.json 2>/dev/null))"; exit 1
          fi
      - name: Check nk-demo.trythis.one
        if: always()
        continue-on-error: true
        run: |
          edge=()
          if [ -n "$TRYTHIS_COUNTRY_BYPASS" ]; then echo "::add-mask::$TRYTHIS_COUNTRY_BYPASS"; edge=(-H "x-trythis-country-bypass: $TRYTHIS_COUNTRY_BYPASS"); fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "${edge[@]}" https://nk-demo.trythis.one/rooms || true)
          if [ "$code" = "200" ]; then echo "Also at https://nk-demo.trythis.one" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$TRYTHIS_COUNTRY_BYPASS" ]; then echo "::notice::https://nk-demo.trythis.one answered $code; TRYTHIS_COUNTRY_BYPASS is not set, so the country rule stops this check"
          else echo "::warning::https://nk-demo.trythis.one answered $code with TRYTHIS_COUNTRY_BYPASS"; fi
