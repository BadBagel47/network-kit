# Seals the demo's measurement reports (F-047) with the reader's public key and
# keeps them on the branch demo-reports (the agent cannot download workflow
# logs), so nothing readable reaches this public repository. Started by the agent.
name: Demo reports

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Reader's RSA public key (base64 SPKI DER)
        required: true
      since:
        description: Only reports after this time (ms since 1970)
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEMO_URL: https://network-kit-demo.l8p1.workers.dev
      PUBLIC_KEY: ${{ inputs.public_key }}
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and seal the reports
        run: |
          # The same key the demo deploy gives the Worker (see deploy-demo.yml).
          DIAG_KEY=$(printf 'network-kit demo diag\n%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$DIAG_KEY"
          DIAG_KEY="$DIAG_KEY" OUT="$RUNNER_TEMP/sealed.txt" node scripts/demo-reports.mjs
      - name: Keep the sealed reports on the branch demo-reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/demo-reports >/dev/null; then
            git fetch -q origin demo-reports && git checkout -q -B demo-reports FETCH_HEAD
          else
            git checkout -q --orphan demo-reports && git rm -rqf .
          fi
          cp "$RUNNER_TEMP/sealed.txt" sealed.txt
          git add sealed.txt
          git commit -q -m "Sealed demo reports (F-047)" || echo "Nothing new"
          git push -q origin demo-reports
