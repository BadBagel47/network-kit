# Deploys the admin page (admin/, F-008) to Cloudflare from main.
# Repository secrets:
#   CLOUDFLARE_API_TOKEN        deploys Workers (the same token as the demo); without it the job is skipped
#   ADMIN_PASSWORD              the page's password, at least 12 characters
#   CLOUDFLARE_ANALYTICS_TOKEN  read-only token: Account Analytics Read and Workers Scripts Read
#   CLOUDFLARE_ACCOUNT_ID       optional; looked up with the deploy token when missing
name: Deploy admin page

on:
  push:
    branches: [main]
    paths:
      - admin/**
      - src/shared/protocol.js
      - src/client/**
      - src/server/**
      - src/version.js
      - scripts/admin-check.mjs
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the admin deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Test, deploy and check
        if: steps.token.outputs.skip != 'true'
        run: |
          npm ci
          node --test tests/unit/admin.test.js tests/unit/playtest.test.js
          npm run admin:assets # the QR codes come from network-kit's client
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(npx wrangler whoami 2>/dev/null | grep -oE '\b[0-9a-f]{32}\b' | head -1)
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          vars=()
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then vars=(--var "CF_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"); fi
          # The admin page also answers at nk-admin.trythis.one, the owner's domain on
          # Cloudflare, so its firewall can protect it (F-098, owner 2026-11-19). The
          # workers.dev address stays until no game uses it (docs/DEPRECATIONS.md).
          if ! npx wrangler deploy --config admin/wrangler.jsonc "${vars[@]}" --domain nk-admin.trythis.one 2>&1 | tee deploy.log; then
            echo "::warning::Could not attach nk-admin.trythis.one (the deploy token may lack the zone's Workers Routes and DNS permissions); deployed on workers.dev only"
            npx wrangler deploy --config admin/wrangler.jsonc "${vars[@]}" 2>&1 | tee deploy.log
          fi
          if [ -n "$ADMIN_PASSWORD" ]; then
            if [ ${#ADMIN_PASSWORD} -lt 12 ]; then echo "::warning::ADMIN_PASSWORD is shorter than 12 characters; the page will not accept it."; fi
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config admin/wrangler.jsonc
          else
            echo "::warning::ADMIN_PASSWORD is not set; nobody can sign in."
          fi
          # The key the agent's workflow reads Playtest reports with (F-091),
          # derived from the deploy token so playtest-reports.yml makes the same.
          READ_KEY=$(printf 'network-kit playtest read\n%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$READ_KEY"
          printf '%s' "$READ_KEY" | npx wrangler secret put PLAYTEST_READ_KEY --config admin/wrangler.jsonc
          if [ -n "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            printf '%s' "$CLOUDFLARE_ANALYTICS_TOKEN" | npx wrangler secret put CF_ANALYTICS_TOKEN --config admin/wrangler.jsonc
          else
            echo "::warning::CLOUDFLARE_ANALYTICS_TOKEN is not set; the page cannot show usage."
          fi
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::warning::Could not find the admin URL in the deploy output"; exit 0; fi
          echo "Admin page: $url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/usage" || true)
            [ "$code" = "401" ] && break
            sleep 5
          done
          [ "$code" = "401" ] || { echo "::error::$url/api/usage answered $code, expected 401 (signed out)"; exit 1; }
          curl -fsS "$url/" | grep -q 'Delar av adminsidan' || { echo "::error::$url did not serve the page"; exit 1; }
          # Playtest (F-091): a tester's browser on another site is let in, and a wrong tester link is refused.
          curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$url/playtest/report" -H 'origin: https://example.org' | grep -q 204 \
            || { echo "::error::$url/playtest/report did not answer a tester's browser"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/playtest/check" -H 'content-type: application/json' -d '{"token":"pt_x.y"}')
          [ "$code" = "401" ] || { echo "::error::$url/playtest/check answered $code, expected 401"; exit 1; }
          curl -fsS "$url/remote/" | grep -q 'Playtest Remote' || { echo "::error::$url/remote/ did not serve Playtest Remote"; exit 1; }
          echo "The page answers and asks for sign-in." >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://nk-admin.trythis.one/remote/ || true)
          if [ "$code" = "200" ]; then echo "Also at https://nk-admin.trythis.one" >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::https://nk-admin.trythis.one answered $code"; fi
      - name: Check Cloudflare's usage figures
        if: steps.token.outputs.skip != 'true' && env.CLOUDFLARE_ANALYTICS_TOKEN != ''
        continue-on-error: true
        run: |
          node scripts/admin-check.mjs | tee check.log
          { echo '```'; cat check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
