# Seals a game's Playtest reports (F-091) with the reader's public key and keeps
# them on the branch playtest-reports (the agent cannot download workflow
# logs), so nothing readable reaches this public repository. Started by the
# developing agent of any game, from its own session with this repository added.
# Open with: node scripts/open-reports.mjs <private-key.pem> <game>.txt [picture dir]
name: Playtest reports

on:
  workflow_dispatch:
    inputs:
      game:
        description: The game's name, as on its tester links (e.g. critical)
        required: true
      public_key:
        description: Reader's RSA public key (base64 SPKI DER)
        required: true
      since:
        description: Only reports after this time (ms since 1970)
        required: false
        default: '0'
      keep:
        description: Report ids to keep past 30 days (Behåll), separated by commas
        required: false
        default: ''
      what:
        description: reports, recordings (Playtest Recorder, F-092) or both
        required: false
        default: reports
      open_test:
        description: Also Open test's items, from unknown visitors (F-124), apart under openTest (yes/no)
        required: false
        default: 'no'
      where:
        description: live (the real admin page) or preview (nk-admin-preview.trythis.one, the owner's tries before Publicera)
        required: false
        default: live

permissions:
  contents: write

concurrency:
  group: playtest-reports
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TRYTHIS_COUNTRY_BYPASS: ${{ secrets.TRYTHIS_COUNTRY_BYPASS }}
      PUBLIC_KEY: ${{ inputs.public_key }}
      GAME: ${{ inputs.game }}
      SINCE: ${{ inputs.since }}
      KEEP: ${{ inputs.keep }}
      WHAT: ${{ inputs.what }}
      OPEN: ${{ inputs.open_test }}
      WHERE: ${{ inputs.where }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and seal the reports
        run: |
          case "$GAME" in (*[!a-z0-9-]*|'') echo "::error::bad game name"; exit 1;; esac
          case "$WHAT" in (reports|recordings|both) ;; (*) echo "::error::what must be reports, recordings or both"; exit 1;; esac
          # The same keys the deploys give the Workers (deploy-admin.yml, preview.yml).
          case "$WHERE" in
            (live) ADMIN_URL=https://network-kit-admin.l8p1.workers.dev; SALT='network-kit playtest read' ;;
            (preview) ADMIN_URL=https://nk-admin-preview.trythis.one; SALT='network-kit playtest read preview'
              if [ -n "$TRYTHIS_COUNTRY_BYPASS" ]; then echo "::add-mask::$TRYTHIS_COUNTRY_BYPASS"; export EDGE_BYPASS="$TRYTHIS_COUNTRY_BYPASS"; fi ;;
            (*) echo "::error::where must be live or preview"; exit 1 ;;
          esac
          READ_KEY=$(printf '%s\n%s' "$SALT" "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$READ_KEY"
          ADMIN_URL="$ADMIN_URL" READ_KEY="$READ_KEY" OUT="$RUNNER_TEMP/sealed.txt" node scripts/playtest-reports.mjs
      - name: Keep the sealed reports on the branch playtest-reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recordings alone go in their own file, so a reading of reports never replaces them (F-092).
          FILE="$GAME.txt"; [ "$WHAT" = recordings ] && FILE="$GAME-recordings.txt"
          [ "$WHERE" = preview ] && FILE="preview-$FILE"
          # GitHub refuses files over 100 MB (F-135): stop well before, and say how to narrow it.
          SIZE=$(stat -c %s "$RUNNER_TEMP/sealed.txt")
          if [ "$SIZE" -gt $((50 * 1024 * 1024)) ]; then
            echo "::error::the sealed file is $((SIZE / 1024 / 1024)) MB; narrow it with since (only newer) or what: reports"; exit 1
          fi
          # The branch keeps only the newest file of each game, in a single commit (F-135):
          # its history no longer grows with every reading. The workflow owns this branch.
          mkdir -p "$RUNNER_TEMP/kept"
          if git ls-remote --exit-code origin refs/heads/playtest-reports >/dev/null; then
            git fetch -q origin playtest-reports && git checkout -q FETCH_HEAD
            cp ./*.txt "$RUNNER_TEMP/kept/" 2>/dev/null || true
          fi
          git checkout -q --orphan fresh-playtest-reports && git rm -rqf . 2>/dev/null || true
          cp "$RUNNER_TEMP/kept/"*.txt . 2>/dev/null || true
          cp "$RUNNER_TEMP/sealed.txt" "$FILE"
          git add ./*.txt
          git commit -q -m "Sealed Playtest readings (newest per game; this run: $WHAT for $GAME) (F-091, F-092, F-135)"
          git push -q -f origin HEAD:playtest-reports
