<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10142a">
  <title>Playtest Remote</title>
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <main>
    <header>
      <h1>Playtest Remote</h1>
      <p id="status" class="muted" role="status"></p>
    </header>

    <form id="join" class="card" hidden>
      <label for="code">Koden som spelet visar</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" inputmode="text" required>
      <button type="submit" class="go">Koppla</button>
      <p id="join-error" class="warn" role="alert"></p>
    </form>

    <section id="list" class="card" hidden aria-label="Testerna">
      <p id="who" class="muted"></p>
      <p id="list-note" class="note" role="status"></p>
      <div id="items" class="items"></div>
    </section>

    <section id="test" class="card" hidden aria-label="Testet">
      <div class="muted" id="test-id"></div>
      <h2 id="test-title"></h2>
      <ol id="steps"></ol>
      <button type="button" id="next-step">Nästa steg</button>
      <div id="links" class="row"></div>
      <div id="questions"></div>
      <label>Övrigt (valfritt) <textarea id="extra" rows="3"></textarea></label>
      <div class="row" role="group" aria-label="Resultat">
        <button type="button" data-result="worked" aria-pressed="false">Fungerade</button>
        <button type="button" data-result="partly" aria-pressed="false">Delvis</button>
        <button type="button" data-result="failed" aria-pressed="false">Fungerade inte</button>
      </div>
      <div class="row">
        <button type="button" id="shot">Skärmbild från spelet</button>
        <button type="button" id="photo">Ta foto eller välj bild</button>
        <input type="file" id="photo-file" accept="image/*" hidden>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <p id="test-note" class="warn" role="status"></p>
      <div class="row">
        <button type="button" id="send" class="go">Skicka</button>
        <button type="button" id="restart">Börja om</button>
        <button type="button" id="cancel">Avbryt</button>
      </div>
    </section>
  </main>
  <script type="module" src="remote.js"></script>
</body>
</html>
